# Pages CMS configuration (https://pagescms.org).
# The client signs in with GitHub and edits products through simple forms.
# Each save becomes a Git commit; Cloudflare then rebuilds and publishes the site.
# Verify this file on first connection: Pages CMS shows a clear error if a key is wrong.

media:
  input: src/assets/products
  output: /assets/products
  extensions: [png, jpg, jpeg, webp]
  rename: safe

content:
  - name: products
    label: Products
    type: collection
    path: src/content/products
    format: json
    fields:
      - name: sku
        label: Product code (SKU)
        type: string
        required: true
        description: Unique code. Example: RIC-001
      - name: name
        label: Product name (as printed on the pack)
        type: string
        required: true
      - name: description
        label: Short description (optional)
        type: text
        required: false
        description: One or two short sentences, under 300 characters. It is shown exactly as written in every language.
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - { value: rice, label: "Rice" }
            - { value: whole-spices, label: "Whole spices" }
            - { value: ground-spices-powders, label: "Ground spices & powders" }
            - { value: spice-blends-seasonings, label: "Spice blends & seasonings" }
            - { value: dried-herbs-vegetables, label: "Dried herbs & vegetables" }
            - { value: pulses-legumes, label: "Pulses & legumes" }
            - { value: dairy, label: "Dairy" }
            - { value: snack-items, label: "Snack items" }
            - { value: product-collections, label: "Product collections" }
      - name: unitWeight
        label: Unit weight or pack sizes (optional)
        type: string
        required: false
        description: Write it as it should appear. Examples: 100 g, or 1 kg / 2 kg / 5 kg
      - name: moq
        label: Minimum order (MOQ)
        type: object
        fields:
          - { name: value, label: Amount, type: number, required: true }
          - name: unit
            label: Unit
            type: select
            required: true
            default: ton
            options:
              values:
                - { value: ton, label: metric ton }
                - { value: kg, label: kg }
                - { value: carton, label: carton }
                - { value: pallet, label: pallet }
                - { value: pcs, label: pcs }
      - name: images
        label: Photos
        type: image
        list: true
        required: true
        description: The first photo is the main one. PNG or JPG under about 2 MB, plain background. Check that the pack does not show the origin country.
      - name: published
        label: Show on the website
        type: boolean
        default: true
      - name: featured
        label: Show in the home page carousel
        type: boolean
        default: false
      - name: order
        label: Sort order (lower comes first)
        type: number
        default: 100
